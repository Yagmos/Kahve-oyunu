  <!-- Kaldırım ve yol -->
  <rect x="0" y="1180" width="1080" height="120" fill="#584438"/>
  <rect x="0" y="1180" width="1080" height="12" fill="#7a5f4d"/>
  <rect x="0" y="1300" width="1080" height="620" fill="url(#sroad)"/>
  <g fill="#f5e9da" opacity="0.18">
    <rect x="60" y="1520" width="150" height="14" rx="7"/>
    <rect x="330" y="1520" width="150" height="14" rx="7"/>
    <rect x="600" y="1520" width="150" height="14" rx="7"/>
    <rect x="870" y="1520" width="150" height="14" rx="7"/>
  </g>

  <!-- Sokak lambası -->
  <g fill="#2b1d12">
    <rect x="150" y="760" width="16" height="440"/>
    <rect x="150" y="760" width="110" height="14" rx="7"/>
  </g>
  <circle cx="258" cy="786" r="20" fill="#ffe2ad" opacity="0.7"/>
