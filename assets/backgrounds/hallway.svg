<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="hwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#523823"/><stop offset="100%" stop-color="#2e1e12"/>
    </linearGradient>
    <linearGradient id="hlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2d9a8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f2d9a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hfloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a5539"/><stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="#241408"/>
  <rect width="1080" height="1380" fill="url(#hwall)"/>

  <!-- Derinlik: koridorun sonundaki aydınlık -->
  <polygon points="380,620 700,620 640,1380 440,1380" fill="#8d6a45" opacity="0.55"/>
  <rect x="430" y="660" width="220" height="640" fill="#d8b478" opacity="0.35"/>

  <!-- Dolaplar (sol) -->
  <g>
    <rect x="0" y="700" width="330" height="620" fill="#3f2b1b"/>
    <g fill="#54381f">
      <rect x="14" y="716" width="92" height="588" rx="8"/>
      <rect x="118" y="716" width="92" height="588" rx="8"/>
      <rect x="222" y="716" width="92" height="588" rx="8"/>
    </g>
    <g fill="#d9a441" opacity="0.6">
      <circle cx="92" cy="1010" r="7"/><circle cx="196" cy="1010" r="7"/><circle cx="300" cy="1010" r="7"/>
    </g>
  </g>

  <!-- Kapılar (sağ) -->
  <g>
    <rect x="760" y="720" width="300" height="600" rx="6" fill="#3f2b1b"/>
    <rect x="790" y="750" width="240" height="540" rx="6" fill="#5a3b24"/>
    <rect x="800" y="800" width="220" height="140" rx="4" fill="#8d6a45" opacity="0.5"/>
    <circle cx="1000" cy="1050" r="9" fill="#d9a441" opacity="0.7"/>
  </g>

  <!-- Tavan ışıkları -->
  <g>
    <rect x="470" y="180" width="140" height="26" rx="10" fill="#f5e9da" opacity="0.75"/>
    <polygon points="470,206 610,206 700,620 380,620" fill="url(#hlight)"/>
  </g>

  <!-- Zemin -->
  <rect x="0" y="1380" width="1080" height="540" fill="url(#hfloor)"/>
  <g opacity="0.15" fill="#f5e9da">
    <polygon points="440,1380 640,1380 900,1920 180,1920"/>
  </g>
</svg>
